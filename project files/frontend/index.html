<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .btn-primary {
            background-color: #006514D5 !important;
            border-color: #006514D5 !important;
        }
        .btn-primary:hover {
            background-color: #005013 !important;
            border-color: #005013 !important;
        }
    </style>
</head>
<body style="background-image: url('bg.avif'); background-size: cover; background-repeat: no-repeat;">
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><img src="hematology-blood-cell-logo-design.avif" alt="Logo" width="50" height="50"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="result.html">Result</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h1 class="text-center mb-4">Blood Cell Classification</h1>
                <p class="text-center mb-4">Upload an image of a blood cell to classify it into one of the categories: Eosinophil, Lymphocyte, Monocyte, or Neutrophil.</p>
                <div class="card">
                    <div class="card-body">
                        <form id="uploadForm" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="imageInput" class="form-label">Select Blood Cell Image</label>
                                <input class="form-control" type="file" id="imageInput" accept="image/*" required>
                            </div>
                            <div class="text-end">
                                <button type="submit" class="btn btn-primary" id="submitBtn">Classify Image</button>
                            </div>
                        </form>
                        <div id="loading" class="text-center mt-3 d-none">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p>Classifying image...</p>
                        </div>
                        <div id="error" class="alert alert-danger mt-3 d-none" role="alert"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('uploadForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const fileInput = document.getElementById('imageInput');
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const errorDiv = document.getElementById('error');

            if (!fileInput.files[0]) {
                errorDiv.textContent = 'Please select an image file.';
                errorDiv.classList.remove('d-none');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            submitBtn.disabled = true;
            loading.classList.remove('d-none');
            errorDiv.classList.add('d-none');

            try {
                const response = await fetch('http://localhost:5000/predict', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('Failed to classify image');
                }

                const result = await response.json();
                localStorage.setItem('prediction', result.prediction);
                localStorage.setItem('confidence', result.confidence);

                // Read the uploaded image as data URL and store it
                const reader = new FileReader();
                reader.onload = function(e) {
                    localStorage.setItem('uploadedImage', e.target.result);
                    window.location.href = 'result.html';
                };
                reader.readAsDataURL(fileInput.files[0]);
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('d-none');
            } finally {
                submitBtn.disabled = false;
                loading.classList.add('d-none');
            }
        });
    </script>
    <div class="footer" style="position: fixed; bottom: 0; width: 100%;">
        <footer class="text-center py-3 bg-dark text-white">
            © 2026 | Designed & Developed by Shaik Imran
        </footer>
    </div>
</body>
</html>
